<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 5秒後に自動的に新しいサイトへリダイレクト（転送）する設定（必要に応じて時間を変更できます） -->
  <meta http-equiv="refresh" content="5;url=https://sirotumekuma.github.io/jutool/">
  
  <title>本ページは移転しました</title>
  
  <style>
    /* CSS: スタイル定義 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 16px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #555555;
      margin-bottom: 24px;
    }

    .redirect-link {
      display: inline-block;
      background-color: #007bff;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 6px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      word-break: break-all;
    }

    .redirect-link:hover {
      background-color: #0056b3;
      transform: translateY(-1px);
    }

    .countdown-text {
      margin-top: 20px;
      font-size: 13px;
      color: #888888;
    }

    .countdown-number {
      font-weight: bold;
      color: #007bff;
    }
  </style>
</head>
<body>

  <!-- HTML: ページ構造 -->
  <div class="container">
    <div class="icon">🚚</div>
    <h1>本ページは移転しました</h1>
    
    <p>
      ぜひ便利になった <strong>ju!tool (ju!count)</strong> をお楽しみください！
    </p>

    <a href="https://sirotumekuma.github.io/jutool/" class="redirect-link">
      ju!tool(ju!count) へ移動する
    </a>

    <p class="countdown-text">
      <span id="countdown" class="countdown-number">5</span> 秒後に自動で移動します。<br>
      自動で切り替わらない場合は上のボタンをクリックしてください。
    </p>
  </div>

  <!-- JavaScript: カウントダウン表示と制御 -->
  <script>
    let seconds = 5;
    const countdownElement = document.getElementById('countdown');

    const timer = setInterval(() => {
      seconds--;
      if (countdownElement) {
        countdownElement.textContent = seconds;
      }
      if (seconds <= 0) {
        clearInterval(timer);
        // 万が一 meta タグの転送が動作しない場合のフォールバック
        window.location.href = "https://sirotumekuma.github.io/jutool/";
      }
    }, 1000);
  </script>

</body>
</html>
