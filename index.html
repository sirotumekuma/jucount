<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="校時表に合わせて現在の時限と残り時間を表示する、じゅかうんと。">
  <title>じゅかうんと</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">SCHOOL TIME TABLE</p>
        <h1>じゅかうんと</h1>
      </div>
      <div class="header-actions">
        <time id="current-date" class="current-date" datetime=""></time>
        <button id="settings-button" class="settings-button" type="button" aria-label="設定を開く" aria-expanded="false">⚙</button>
      </div>
    </header>

    <section class="status-card" aria-live="polite">
      <div class="status-card__top">
        <span id="status-label" class="status-label">現在の時限</span>
        <span id="period-time" class="period-time"></span>
      </div>
      <h2 id="period-name">読み込み中</h2>
      <div class="countdown" id="countdown" aria-label="残り時間">00:00</div>
      <p id="countdown-caption" class="countdown-caption">終了まで</p>
      <div class="progress-track" role="progressbar" aria-label="時限の進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="next-period" class="next-period"></p>
    </section>

    <footer>
      <p>時刻は端末の現在時刻を使用しています</p>
    </footer>
  </main>
  <div id="settings-overlay" class="settings-overlay" hidden>
    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-panel__header">
        <h2 id="settings-title">設定</h2>
        <button id="settings-close" class="close-button" type="button" aria-label="設定を閉じる">×</button>
      </div>
      <div class="setting-row">
        <div>
          <strong>ダークモード</strong>
          <p>暗い場所でも見やすい配色にします</p>
        </div>
        <label class="switch">
          <input id="dark-mode-toggle" type="checkbox">
          <span class="switch__slider"></span>
        </label>
      </div>
      <div class="setting-group">
        <strong>校時</strong>
        <div class="mode-options" role="group" aria-label="校時">
          <button class="mode-option" type="button" data-mode="normal">通常校時</button>
          <button class="mode-option" type="button" data-mode="short">短縮校時</button>
          <button class="mode-option" type="button" data-mode="test">テスト校時</button>
        </div>
      </div>
      <div class="setting-group">
        <strong>テーマカラー</strong>
        <div class="color-options" role="group" aria-label="テーマカラー">
          <button class="color-option is-selected" type="button" data-color="#007bff" aria-label="ブルー" title="ブルー"></button>
          <button class="color-option" type="button" data-color="#6f42c1" aria-label="パープル" title="パープル"></button>
          <button class="color-option" type="button" data-color="#e8590c" aria-label="オレンジ" title="オレンジ"></button>
          <button class="color-option" type="button" data-color="#d63384" aria-label="ピンク" title="ピンク"></button>
          <button class="color-option" type="button" data-color="#00897b" aria-label="ティール" title="ティール"></button>
        </div>
      </div>
      <button id="show-schedule-button" class="schedule-view-button" type="button">本日の校時を表示</button>
      <section id="schedule-panel" class="schedule-panel" hidden>
        <div class="section-heading">
          <h3>本日の校時</h3>
          <span id="schedule-mode-label"></span>
        </div>
        <ol id="schedule-list" class="schedule-list"></ol>
      </section>
    </section>
  </div>
  <div id="mode-onboarding" class="settings-overlay" hidden>
    <section class="onboarding-panel" role="dialog" aria-modal="true" aria-labelledby="onboarding-title">
      <p class="eyebrow">WELCOME</p>
      <h2 id="onboarding-title">今日の校時を選択</h2>
      <p class="onboarding-description">使用する校時表を選んでください。あとから設定で変更できます。</p>
      <div class="onboarding-options" role="group" aria-label="校時の初期設定">
        <button class="onboarding-option" type="button" data-mode="normal">
          <strong>通常校時</strong><span>いつもの時間割</span>
        </button>
        <button class="onboarding-option" type="button" data-mode="short">
          <strong>短縮校時</strong><span>短縮された時間割</span>
        </button>
        <button class="onboarding-option" type="button" data-mode="test">
          <strong>テスト校時</strong><span>テスト期間の時間割</span>
        </button>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
